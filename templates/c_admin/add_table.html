{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Cafe Table</title>

    <!-- GOOGLE FONT -->

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- FONT AWESOME -->

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins', sans-serif;
        }

        body{
            min-height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;

            padding:20px;

            background:
            linear-gradient(rgba(18,12,8,0.82),
            rgba(18,12,8,0.88)),
            url("https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?q=80&w=2070&auto=format&fit=crop");

            background-size:cover;
            background-position:center;
            background-attachment:fixed;
        }

        /* MAIN CARD */

        .table-card{
            width:100%;
            max-width:480px;

            background:rgba(255,255,255,0.96);

            border-radius:32px;

            padding:45px 40px;

            box-shadow:0 25px 50px rgba(0,0,0,0.25);

            position:relative;

            overflow:hidden;
        }

        /* TOP DECOR */

        .table-card::before{
            content:"";

            position:absolute;

            top:-120px;
            right:-120px;

            width:250px;
            height:250px;

            border-radius:50%;

            background:rgba(201,123,54,0.08);
        }

        .table-card::after{
            content:"";

            position:absolute;

            bottom:-100px;
            left:-100px;

            width:220px;
            height:220px;

            border-radius:50%;

            background:rgba(201,123,54,0.06);
        }

        /* ICON */

        .icon-box{
            width:90px;
            height:90px;

            margin:auto;

            border-radius:28px;

            background:linear-gradient(
            135deg,
            #d28a45,
            #8b5e34
            );

            display:flex;
            justify-content:center;
            align-items:center;

            color:white;

            font-size:38px;

            margin-bottom:28px;

            box-shadow:0 18px 35px rgba(201,123,54,0.28);

            position:relative;

            z-index:2;
        }

        /* TITLE */

        .title{
            text-align:center;

            position:relative;

            z-index:2;
        }

        .title h1{
            font-size:36px;

            color:#2c1e17;

            margin-bottom:10px;
        }

        .title p{
            color:#7a6a61;

            font-size:15px;

            line-height:1.7;

            margin-bottom:40px;
        }

        /* FORM */

        .form-group{
            margin-bottom:25px;

            position:relative;

            z-index:2;
        }

        .form-group label{
            display:block;

            margin-bottom:10px;

            color:#4b3428;

            font-size:14px;

            font-weight:600;
        }

        .input-box{
            position:relative;
        }

        .input-box i{
            position:absolute;

            top:50%;
            left:18px;

            transform:translateY(-50%);

            color:#b66b2b;

            font-size:16px;
        }

        .input-box input{
            width:100%;

            padding:17px 18px 17px 52px;

            border:none;

            border-radius:18px;

            background:#f7f3ef;

            font-size:15px;

            color:#2c1e17;

            outline:none;

            transition:0.3s;
        }

        .input-box input:focus{
            background:white;

            box-shadow:0 0 0 4px rgba(201,123,54,0.12);
        }

        /* BUTTON */

        .submit-btn{
            width:100%;

            border:none;

            padding:18px;

            border-radius:18px;

            background:linear-gradient(
            135deg,
            #d28a45,
            #b66b2b
            );

            color:white;

            font-size:16px;

            font-weight:600;

            cursor:pointer;

            margin-top:10px;

            transition:0.3s;

            position:relative;

            z-index:2;
        }

        .submit-btn:hover{
            transform:translateY(-3px);

            box-shadow:0 15px 30px rgba(201,123,54,0.28);
        }

        .submit-btn i{
            margin-right:10px;
        }

        /* BOTTOM NOTE */

        .bottom-note{
            text-align:center;

            margin-top:28px;

            color:#8d7d73;

            font-size:13px;

            position:relative;

            z-index:2;
        }

        /* MOBILE */

        @media(max-width:500px){

            .table-card{
                padding:40px 25px;
            }

            .title h1{
                font-size:28px;
            }

            .icon-box{
                width:75px;
                height:75px;

                font-size:30px;
            }


        }
  .header{
    top: 0;
    left: 0;

    display: flex;
    justify-content: space-between;
    align-items: center;

    background-color: rgb(20, 7, 1);

    height: 90px;
    width: 100%;

    position: fixed;

  
}
.main_content{
    margin-top: 120px;

    width: 100%;

    display: flex;
    

    justify-content: center;

    align-items: center;
}

    </style>

</head>

<body>
         {% include 'nav.html' %}


<div class="table-card">

    <!-- ICON -->

    <div class="icon-box">

        <i class="fa-solid fa-chair"></i>

    </div>

    <!-- TITLE -->

    <div class="title">

        <h1>

            Add Cafe Table

        </h1>

        <p>

            Create a new table setup for your
            cafe seating management system.

        </p>

    </div>

    <!-- FORM -->

    <form method="POST">

        {% csrf_token %}

        <!-- TABLE NUMBER -->

        <div class="form-group">

            <label>

                Table Number

            </label>

            <div class="input-box">

                <i class="fa-solid fa-hashtag"></i>

                <input type="number"
                       name="table_number"
                       placeholder="Enter table number"
                       required>

            </div>

        </div>

        <!-- SEATS -->

        <div class="form-group">

            <label>

                Number of Seats

            </label>

            <div class="input-box">

                <i class="fa-solid fa-users"></i>

                <input type="number"
                       name="seats"
                       placeholder="Enter seating capacity"
                       required>

            </div>

        </div>

        <!-- BUTTON -->

        <button type="submit"
                class="submit-btn">

            <i class="fa-solid fa-plus"></i>

            Add Table

        </button>

    </form>

    <!-- FOOTER -->

    <div class="bottom-note">

        Cozy Cafe Admin Panel ☕

    </div>

</div>

</body>

</html>
