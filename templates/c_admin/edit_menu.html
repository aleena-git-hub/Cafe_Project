{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Menu</title>
    <style>
        /* Modern Reset & Base Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* Smooth background image with a dark overlay tint */
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), 
                        url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1200&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Form Container Card */
        .form-container {
            background: rgb(194, 194, 194); /* Slightly transparent card */
            max-width: 500px;
            width: 100%;
            padding: 60px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #a15c0c;
            margin-bottom: 24px;
            text-align: center;
        }

        /* Form Layout Groups */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: #555;
        }

        /* Input Controls */
        input[type="text"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 0.95rem;
            background-color: #fafafa;
            transition: all 0.3s ease;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #4f46e5;
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        /* Image Preview Section */
        .image-preview-box {
            background-color: #f9f6f1;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 10px;
        }

        .image-preview-box p {
            font-size: 0.8rem;
            color: #64748b;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .image-preview-box img {
            max-width: 120px;
            max-height: 120px;
            object-fit: cover;
            border-radius: 6px;
            border: 2px solid #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        input[type="file"] {
            font-size: 0.85rem;
            color: #64748b;
            margin-top: 5px;
        }

        /* Submit Button */
        button[type="submit"] {
            width: 100%;
            background-color: #a16e10;
            color: white;
            border: none;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            margin-top: 10px;
        }

        button[type="submit"]:hover {
            background-color: #be7e00;
        }

        button[type="submit"]:active {
            transform: scale(0.98);
        }

 .header{
    top: 0;
    left: 0;

    display: flex;
    justify-content: space-between;
    align-items: center;

    background-color: rgb(20, 7, 1);

    height: 90px;
    width: 100%;

    position: fixed;

  
}
.main_content{
    margin-top: 120px;

    width: 100%;

    display: flex;
    

    justify-content: center;

    align-items: center;
}

    </style>

</head>

<body>
         {% include 'nav.html' %}
         <br><br><br>
    <div class="form-container">
        <h1>Edit Menu Item</h1>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="form-group">
                <label for="category">Select Category</label>
                <select name="category" id="category">
                    {% for i in categories %}
                    <option value="{{ i.id }}" {% if i.id == product.category.id %}selected{% endif %}>
                        {{ i.name }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="name">Product Name</label>
                <input type="text" id="name" name="name" value="{{ product.name }}" placeholder="e.g., Spicy Pepperoni Pizza" required>
            </div>

            <div class="form-group">
                <label for="price">Price ($)</label>
                <input type="number" id="price" name="price" value="{{ product.price }}" placeholder="0.00" step="0.01" required>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" placeholder="Describe this delicious menu item..." required>{{ product.description }}</textarea>
            </div>

            <div class="form-group">
                <label>Item Image</label>
                <!-- Fixed context variable from i.photo.url to product.photo.url -->
                {% if product.photo %}
                <div class="image-preview-box">
                    <p>Current Image</p>
                    <img src="{{ product.photo.url }}" alt="{{ product.name }}">
                </div>
                {% endif %}
                <input type="file" name="photo">
            </div>

            <button type="submit">Update Menu</button>
        </form>
    </div>

</body>
</html>
