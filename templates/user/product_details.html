{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ product.name }}</title>

    <!-- GOOGLE FONT -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- FONT AWESOME -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins', sans-serif;
        }

        body{
            min-height:100vh;

            background:
            linear-gradient(rgba(17,12,8,0.85),
            rgba(17,12,8,0.85)),
            url("https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?q=80&w=2070&auto=format&fit=crop");

            background-size:cover;
            background-position:center;
            background-attachment:fixed;

            display:flex;
            justify-content:center;
            align-items:center;

            padding:40px 20px;
        }

        /* MAIN CARD */

        .product-card{
            width:100%;
            max-width:1200px;

            background:rgba(255,255,255,0.08);

            backdrop-filter:blur(14px);

            border-radius:35px;

            overflow:hidden;

            display:grid;
            grid-template-columns:1fr 1fr;

            border:1px solid rgba(255,255,255,0.1);

            box-shadow:0 15px 40px rgba(0,0,0,0.45);
        }

        /* IMAGE SIDE */

        .image-side{
            position:relative;

            background:#1d140e;

            display:flex;
            justify-content:center;
            align-items:center;

            padding:50px;
        }

        .image-circle{
            width:430px;
            height:430px;

            border-radius:50%;

            overflow:hidden;

            border:10px solid rgba(255,255,255,0.08);

            box-shadow:0 15px 35px rgba(0,0,0,0.4);
        }

        .image-circle img{
            width:100%;
            height:100%;
            object-fit:cover;

            transition:0.4s;
        }

        .image-circle img:hover{
            transform:scale(1.08);
        }

        /* CONTENT SIDE */

        .content-side{
            padding:70px 55px;

            color:white;

            display:flex;
            flex-direction:column;
            justify-content:center;
        }

        .tag{
            width:fit-content;

            background:#c97b366b;

            color:white;

            padding:10px 20px;

            border-radius:40px;

            font-size:20px;
            font-weight:600;

            margin-bottom:25px;
        }

        .content-side h1{
            font-size:50px;
            margin-bottom:20px;

            line-height:1.1;
        }

        .price{
            font-size:40px;
            color:#f7c08a;

            font-weight:700;

            margin-bottom:25px;
        }

        .description{
            color:#ddd;

            line-height:2;
            font-size:20px;

            margin-bottom:40px;
        }

        /* FEATURES */

        .features{
            display:flex;
            gap:18px;

            margin-bottom:40px;
        }

        .feature-box{
            flex:1;

            background:rgba(255,255,255,0.08);

            border-radius:18px;

            padding:18px;

            text-align:center;

            transition:0.3s;
        }

        .feature-box:hover{
            transform:translateY(-5px);

            background:rgba(255,255,255,0.12);
        }

        .feature-box i{
            font-size:24px;

            color:#f7c08a;

            margin-bottom:10px;
        }

        .feature-box h4{
            font-size:15px;
            color:white;
        }

        /* BUTTONS */

        .btn-group{
            display:flex;
            gap:18px;
        }

        .btn{
            flex:1;

            padding:18px;

            border:none;

            border-radius:15px;

            font-size:16px;
            font-weight:600;

            cursor:pointer;

            transition:0.3s;
        }

        .cart-btn{
            background:#c97b36;
            color:white;
        }

        .cart-btn:hover{
            background:#a86024;

            transform:translateY(-3px);
        }

        .back-btn{
            background:white;
            color:black;
        }

        .back-btn:hover{
            background:#ddd;
        }

        .btn i{
            margin-right:8px;
        }

        /* MOBILE */

        @media(max-width:950px){

            .product-card{
                grid-template-columns:1fr;
            }

            .image-side{
                padding:40px 20px;
            }

            .image-circle{
                width:320px;
                height:320px;
            }

            .content-side{
                padding:40px 30px;
            }

            .content-side h1{
                font-size:40px;
            }

            .price{
                font-size:32px;
            }

            .features{
                flex-direction:column;
            }

            .btn-group{
                flex-direction:column;
            }

        }

   
    header{
    top: 0;
    left: 0;

    display: flex;
    justify-content: space-between;
    align-items: center;

    background-color: rgb(20, 7, 1);

    height: 90px;
    width: 100%;

    position: fixed;

  
}
.main_content{
    margin-top: 120px;

    width: 100%;

    display: flex;
    

    justify-content: center;

    align-items: center;
}

    </style>

</head>

<body>
         {% include 'temp.html' %}

<div class="product-card">

    <!-- IMAGE SIDE -->

    <div class="image-side">

        <div class="image-circle">

            {% if product.photo %}

                <img src="{{ product.photo.url }}">

            {% endif %}

        </div>

    </div>

    <!-- CONTENT SIDE -->

    <div class="content-side">

        <div class="tag">

             {{ product.category.name }}

        </div>

        <h1>

            {{ product.name }}

        </h1>

        <div class="price">

            ₹ {{ product.price }}

        </div>

        <p class="description">

            {{ product.description }}

        </p>

        <!-- FEATURES -->

        <div class="features">

            <div class="feature-box">

                <i class="fa-solid fa-fire"></i>

                <h4>Fresh</h4>

            </div>

            <div class="feature-box">

                <i class="fa-solid fa-mug-hot"></i>

                <h4>Cafe Special</h4>

            </div>

            <div class="feature-box">

                <i class="fa-solid fa-star"></i>

                <h4>Top Rated</h4>

            </div>

        </div>

        <!-- BUTTONS -->

        <div class="btn-group">

            <a href="{% url 'add_to_cart' product.id %}" style="flex:1;">

                <button class="btn cart-btn">

                    <i class="fa-solid fa-cart-shopping"></i>

                    Add To Cart

                </button>

            </a>

            <a href="javascript:history.back()" style="flex:1;">

                <button class="btn back-btn">

                    <i class="fa-solid fa-arrow-left"></i>

                    Back

                </button>

            </a>

        </div>

    </div>

</div>

</body>

</html>
