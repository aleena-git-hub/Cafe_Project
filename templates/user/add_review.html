{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Review</title>

    <!-- GOOGLE FONT -->

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- FONT AWESOME -->

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins', sans-serif;
        }

        body{
            min-height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;

            padding:20px;

            background:
            linear-gradient(rgba(18,12,8,0.88),
            rgba(18,12,8,0.88)),
            url("https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?q=80&w=2070&auto=format&fit=crop");

            background-size:cover;
            background-position:center;
            background-attachment:fixed;
        }

        /* MAIN CARD */

        .review-card{
            width:100%;
            max-width:550px;

            background:rgba(255,255,255,0.08);

            backdrop-filter:blur(14px);

            border:1px solid rgba(255,255,255,0.08);

            border-radius:32px;

            padding:45px 38px;

            box-shadow:0 15px 40px rgba(0,0,0,0.35);

            animation:fadeUp 0.5s ease;

            color:white;
        }

        /* TOP ICON */

        .top-icon{
            width:90px;
            height:90px;

            margin:auto auto 25px;

            border-radius:50%;

            display:flex;
            justify-content:center;
            align-items:center;

            background:rgba(255,255,255,0.08);

            border:1px solid rgba(255,255,255,0.08);

            box-shadow:0 8px 20px rgba(0,0,0,0.2);
        }

        .top-icon i{
            font-size:38px;

            color:#f7c08a;
        }

        /* HEADER */

        .review-header{
            text-align:center;

            margin-bottom:35px;
        }

        .review-header h1{
            font-size:38px;

            font-weight:700;

            color:#f7c08a;

            margin-bottom:12px;
        }

        .review-header p{
            color:#ddd;

            font-size:15px;

            line-height:1.7;
        }

        .review-header span{
            color:white;
            font-weight:600;
        }

        /* FORM */

        .form-group{
            margin-bottom:25px;
        }

        .form-group label{
            display:block;

            margin-bottom:10px;

            font-size:15px;
            font-weight:500;

            color:#f5f5f5;
        }

        /* INPUTS */

        .form-group select,
        .form-group textarea{
            width:100%;

            border:none;
            outline:none;

            padding:16px 18px;

            border-radius:18px;

            background:rgba(255,255,255,0.10);

            border:1px solid rgba(255,255,255,0.08);

            color:white;

            font-size:15px;

            transition:0.3s;
        }

        .form-group select{
            cursor:pointer;

            appearance:none;

            background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 24 24' stroke='%23f7c08a' stroke-width='2'%3e%3cpath stroke-linecap='round' stroke-linejoin='round' d='M19 9l-7 7-7-7'/%3e%3c/svg%3e");

            background-repeat:no-repeat;

            background-position:right 18px center;

            background-size:18px;

            padding-right:50px;
        }

        .form-group select option{
            color:black;
        }

        .form-group textarea{
            resize:none;

            line-height:1.7;
        }

        .form-group textarea::placeholder{
            color:#bbb;
        }

        .form-group select:focus,
        .form-group textarea:focus{
            border-color:#f7c08a;

            background:rgba(255,255,255,0.14);

            box-shadow:0 0 0 4px rgba(247,192,138,0.15);
        }

        /* STAR PREVIEW */

        .star-preview{
            display:flex;
            gap:6px;

            margin-top:12px;

            color:#f7c08a;

            font-size:18px;
        }

        /* BUTTON */

        .submit-btn{
            width:100%;

            border:none;

            padding:18px;

            border-radius:18px;

            background:#c97b36;

            color:white;

            font-size:17px;
            font-weight:600;

            cursor:pointer;

            transition:0.3s;

            box-shadow:0 8px 18px rgba(201,123,54,0.25);
        }

        .submit-btn:hover{
            background:#a86024;

            transform:translateY(-2px);
        }

        .submit-btn i{
            margin-right:8px;
        }

        /* FOOTER */

        .footer-text{
            margin-top:22px;

            text-align:center;

            color:#aaa;

            font-size:13px;

            line-height:1.6;
        }

        /* ANIMATION */

        @keyframes fadeUp{

            from{
                opacity:0;
                transform:translateY(20px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }

        }

        /* MOBILE */

        @media(max-width:600px){

            .review-card{
                padding:35px 24px;
            }

            .review-header h1{
                font-size:30px;
            }

            .top-icon{
                width:78px;
                height:78px;
            }

            .top-icon i{
                font-size:32px;
            }

        }

    header{
    top: 0;
    left: 0;

    display: flex;
    justify-content: space-between;
    align-items: center;

    background-color: rgb(20, 7, 1);

    height: 90px;
    width: 100%;

    position: fixed;

  
}
.main_content{
    margin-top: 120px;

    width: 100%;

    display: flex;
    

    justify-content: center;

    align-items: center;
}

    </style>

</head>

<body>
         {% include 'temp.html' %}

<div class="review-card">

    <!-- ICON -->

    <div class="top-icon">

        <i class="fa-solid fa-mug-hot"></i>

    </div>

    <!-- HEADER -->

    <div class="review-header">

        <h1>

            Add Review

        </h1>

        <p>

            Share your experience about
            <span>{{ product.name }}</span>
            ☕

        </p>

    </div>

    <!-- FORM -->

    <form method="POST">

        {% csrf_token %}

        <!-- RATING -->

        <div class="form-group">

            <label for="rating">

                Rating

            </label>

            <select name="rating"
                    id="rating"
                    required>

                <option value="" disabled selected>

                    Select Rating

                </option>

                <option value="5">

                    ⭐⭐⭐⭐⭐ Excellent

                </option>

                <option value="4">

                    ⭐⭐⭐⭐ Very Good

                </option>

                <option value="3">

                    ⭐⭐⭐ Good

                </option>

                <option value="2">

                    ⭐⭐ Average

                </option>

                <option value="1">

                    ⭐ Poor

                </option>

            </select>

            <div class="star-preview">

                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>

            </div>

        </div>

        <!-- COMMENT -->

        <div class="form-group">

            <label for="comment">

                Your Comment

            </label>

            <textarea
                name="comment"
                id="comment"
                rows="6"
                placeholder="Tell us what you loved about the food, coffee, taste, service, or ambience..."
                required></textarea>

        </div>

        <!-- BUTTON -->

        <button type="submit"
                class="submit-btn">

            <i class="fa-solid fa-paper-plane"></i>

            Submit Review

        </button>

    </form>

    <!-- FOOTER -->

    <div class="footer-text">

        Your feedback helps us improve
        and serve better experiences ✨

    </div>

</div>

</body>

</html>
